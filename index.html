<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c2a"><link rel="manifest" href="manifest.webmanifest"><title>CORSO I.A. — Anteprima iPhone</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#111c2a;color:#eef3f7}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px;border-bottom:1px solid #304457}.brand b{font-size:20px}.small,.muted{color:#aebed0;font-size:13px}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);max-width:1100px;margin:auto;min-height:90vh}nav{background:#152538;padding:16px;display:flex;flex-direction:column;gap:10px}button{border:0;border-radius:9px;background:#355a7a;color:#fff;font:inherit;font-weight:600;padding:12px 14px;cursor:pointer}button:focus-visible{outline:3px solid #b6d9ef}nav button{text-align:left;background:transparent;color:#d4e1ed}nav button.active{background:#304a65}main{padding:24px;max-width:800px;width:100%;margin:auto}h1{font-size:clamp(25px,5vw,34px);line-height:1.15}h2{font-size:21px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:18px;border:1px solid #304658;background:#1a2b3b;border-radius:15px;margin:10px 0 18px}.card h3{margin-top:0}.card p{line-height:1.65}.tag{display:inline-block;background:#34546e;color:#e3edf7;border-radius:20px;padding:4px 10px;font-size:12px}.warn{background:#2d3342;border-left:3px solid #a7c3d8;padding:13px;margin:16px 0;border-radius:6px}.lesson-btn{width:100%;text-align:left;display:block;background:#263d52;margin:9px 0;font-weight:500}.lesson-btn:disabled{opacity:.55;cursor:default}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.sub{color:#bac9d7}.answer{display:block;padding:12px;border:1px solid #3c5367;border-radius:9px;margin:8px 0;cursor:pointer}.answer:has(input:checked){border-color:#9ec9ee;background:#243c53}input{margin-right:8px}.feedback{padding:12px;background:#273c50;border-radius:9px;margin-top:8px}.progress{height:9px;background:#354a5c;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#84b6db}footer{color:#aebed0;font-size:12px;padding-top:24px}.flag{color:#c9d5e4}@media(max-width:640px){.layout{display:block;padding-bottom:67px}nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px 6px env(safe-area-inset-bottom);border-top:1px solid #364a5a}nav button{font-size:12px;padding:12px 3px;text-align:center}main{padding:20px 16px}.grid{grid-template-columns:1fr}.brand{padding:12px 17px}}</style></head>
<body><header class="brand"><b>🎓 CORSO I.A.</b><span class="small">Anteprima iPhone · V1.0</span></header><div class="layout"><nav id="nav"><button data-p="home" class="active">⌂ Home</button><button data-p="modules">▦ Moduli</button><button data-p="offline">⇩ Offline</button><button data-p="progress">◷ Progressi</button></nav><main id="app" aria-live="polite"></main></div><script>
"use strict";
const titles=["Fondamenti dell'intelligenza artificiale","ChatGPT avanzato","Prompt engineering professionale","ChatGPT Work","Codex e sviluppo software","Automazioni e agenti AI","Modelli locali e API","Laboratorio avanzato"];
const lessons=[
{t:"Che cosa succede quando fai una domanda a un'AI?",p:[["Modello, applicazione e agente","Un modello AI è un sistema matematico addestrato a elaborare informazioni e generare risposte. L'applicazione è l'interfaccia attraverso cui interagiamo, per esempio ChatGPT. Un agente è un sistema che usa modelli e strumenti per coordinare più operazioni: non deve necessariamente essere un modello diverso."],["Chat, Work e Codex","ChatGPT Chat è utile per conversare, spiegare, progettare e analizzare materiali disponibili. Work permette di delegare attività operative in ambienti con strumenti e accessi appropriati. Codex è specializzato nel lavoro sui sorgenti software e può modificarli solo quando dispone degli accessi necessari."],["Locale e cloud","Un modello locale gira sul tuo computer e può funzionare senza Internet; uno online è eseguito su infrastrutture remote. Nessuno dei due è automaticamente infallibile."],["Controllare le prove","Non confondere una dichiarazione dell'AI con una modifica realmente eseguita. Per un software cerca file modificati, test, log e una prova concreta sul dispositivo previsto."]],q:"Un agente AI deve utilizzare un modello diverso dalla chat?",a:["Sì, sempre","No: può usare lo stesso modello insieme a strumenti e procedure","Non usa modelli"],ok:1,why:"L'agente è definito dalle operazioni coordinate e dagli strumenti disponibili, non da un modello necessariamente diverso."},
{t:"Come ragiona un modello AI",p:[["Come nasce una risposta","I modelli linguistici elaborano il testo dividendolo in unità chiamate token. Utilizzano schemi appresi durante l'addestramento per generare nuove sequenze di contenuto."],["Ragionamento e limiti","Alcuni modelli effettuano elaborazioni più articolate prima della risposta, ma la fluidità del linguaggio non dimostra che ciò che dicono sia corretto."],["Esempio concreto","Se chiedi di diagnosticare un errore di GEREMY2 senza fornire registri o sorgenti, il modello può formulare ipotesi, ma non può provare quale sia la causa."]],q:"Una risposta molto convincente è sempre corretta?",a:["Sì","No, deve essere verificata","Solo per le domande tecniche"],ok:1,why:"La qualità linguistica non garantisce l'accuratezza fattuale né l'effettivo svolgimento di operazioni."},
{t:"Memoria, contesto e informazioni disponibili",p:[["Contesto della conversazione","Il contesto è l'insieme delle informazioni accessibili al modello durante una richiesta. Non coincide necessariamente con tutta la cronologia di un account."],["File e accessi","Un nome di cartella scritto in chat non concede automaticamente accesso a quel percorso sul PC. Occorre un ambiente autorizzato che esponga i file."],["Memoria","La memoria può aiutare a ricordare preferenze e informazioni rilevanti, ma non sostituisce i documenti tecnici aggiornati né i test sul software."]],q:"Scrivere il percorso di un file concede automaticamente accesso al PC?",a:["Sì","No, occorrono strumenti e accessi abilitati","Solo su Windows 11"],ok:1,why:"Conoscere un percorso e poter leggere quel file sono due capacità differenti."},
{t:"Errori, allucinazioni e verifiche",p:[["Allucinazioni","Un modello può produrre dettagli inesatti o inventati con tono sicuro. Servono fonti controllabili per affermazioni che richiedono certezza."],["Tre livelli di evidenza","Distingui sempre fra operazione proposta, realmente eseguita e verificata. Un archivio ZIP creato è un risultato; un programma funzionante su iPhone richiede una prova sull'iPhone."],["Revisione indipendente","Nei progetti software, un revisore separato dallo sviluppatore può trovare errori di metodo e anomalie che una sola valutazione rischia di trascurare."]],q:"Un test automatico superato garantisce il funzionamento su ogni PC?",a:["Sì","No, servono collaudi nell'ambiente previsto","Sì, se il file EXE esiste"],ok:1,why:"I test automatici coprono scenari specifici; non equivalgono a un collaudo universale in ambiente reale."}
];
const app=document.getElementById('app'),nav=document.getElementById('nav');let page="home",picked=0,chosen=-1,corrected=false;
function state(){try{return JSON.parse(localStorage.getItem('corso_ia_online_preview_v1')||'{}')}catch{return {}}}
function mark(i){const s=state();s[i]=true;localStorage.setItem('corso_ia_online_preview_v1',JSON.stringify(s));show()}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){page=p;chosen=-1;corrected=false;show();window.scrollTo(0,0)}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)go(b.dataset.p)});
function show(){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.p===(page==='lesson'?'modules':page)));let out='';
if(page==='home'){const n=Object.values(state()).filter(Boolean).length;out='<p class="tag">Percorso 8 moduli · 32 lezioni</p><h1>Impara a dirigere l’intelligenza artificiale</h1><p class="sub">La formazione approfondita in italiano, pensata soprattutto per iPhone.</p><section class="card"><h2>Il tuo percorso</h2><p>'+n+' lezioni completate su 4 disponibili nell’anteprima</p><div class="progress"><div style="width:'+(n*25)+'%"></div></div><div class="actions"><button onclick="openLesson(0)">Inizia il Modulo 1</button></div></section><div class="grid"><section class="card"><h3>Moduli</h3><p>Consulta il programma e apri le lezioni introduttive.</p><button onclick="go(\'modules\')">Apri</button></section><section class="card"><h3>Progressi</h3><p>Salvataggio locale delle verifiche superate.</p><button onclick="go(\'progress\')">Apri</button></section></div><div class="warn"><b>Anteprima interattiva.</b> Sono disponibili testi e quiz delle prime quattro lezioni. I video e i documenti del prototipo completo non sono ancora caricati su GitHub.</div>'}
if(page==='modules'){out='<h1>Programma dei moduli</h1><p class="sub">8 moduli e 32 lezioni previste. Le prime quattro sono consultabili come anteprima testuale.</p>'+titles.map((t,i)=>'<section class="card"><span class="tag">Modulo '+(i+1)+'</span><h2>'+safe(t)+'</h2>'+(i===0?lessons.map((l,j)=>'<button class="lesson-btn" onclick="openLesson('+j+')">'+(state()[j]?'✓ ':'▶ ')+(j+1)+'. '+safe(l.t)+'</button>').join(''):'<p class="muted">4 lezioni pianificate · contenuti non ancora disponibili</p>')+'</section>').join('')}
if(page==='lesson'){const l=lessons[picked];out='<button onclick="go(\'modules\')">← Torna ai moduli</button><p class="tag">Modulo 1 · Lezione '+(picked+1)+'</p><h1>'+safe(l.t)+'</h1><div class="warn">I video narrati completi e il materiale multimediale sono ancora da pubblicare. Questa è la versione testuale didattica di prova.</div>'+l.p.map(a=>'<section class="card"><h2>'+safe(a[0])+'</h2><p>'+safe(a[1])+'</p></section>').join('')+'<section class="card"><h2>Verifica dell’apprendimento</h2><p>'+safe(l.q)+'</p>'+l.a.map((a,j)=>'<label class="answer"><input type="radio" name="quiz" value="'+j+'" '+(chosen===j?'checked':'')+' onchange="chosen='+j+';corrected=false">'+safe(a)+'</label>').join('')+'<button onclick="corrected=true;show()" '+(chosen<0?'disabled':'')+'>Correggi</button>'+(corrected?'<div class="feedback"><b>'+(chosen===l.ok?'Risposta corretta':'Da ripassare')+'</b><p>'+safe(l.why)+'</p>'+(chosen===l.ok?'<button onclick="mark('+picked+')">Segna lezione completata</button>':'')+'</div>':'')+'</section>'}
if(page==='progress'){out='<h1>I tuoi progressi</h1><section class="card"><h2>Modulo 1</h2>'+lessons.map((l,j)=>'<p>'+(state()[j]?'✅':'○')+' '+safe(l.t)+'</p>').join('')+'<p class="muted">I progressi di questa anteprima vengono salvati solo nel browser di questo dispositivo, senza sincronizzazione.</p></section>'}
if(page==='offline'){out='<h1>Download offline</h1><section class="card"><h2>Funzione non ancora attivata</h2><p>Il primo passo è collaudare la piattaforma online sull’iPhone. Il successivo sarà scaricare e verificare i file del modulo per lo studio offline.</p></section>'}
app.innerHTML=out+'<footer>CORSO I.A. · anteprima mobile-first · video definitivi da produrre</footer>'}
window.openLesson=i=>{picked=i;go('lesson')};show();
</script></body></html>
